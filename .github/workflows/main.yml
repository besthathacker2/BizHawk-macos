name: Build BizHawk macOS ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - MacUnixMonoCompat

permissions:
  contents: read

jobs:
  build:
    name: Build BizHawk macOS ARM64
    runs-on: macos-14

    env:
      XAMARIN_MAC_VERSION: "9.3.0.23"
      XAMARIN_MAC_PKG: "xamarin.mac-9.3.0.23.pkg"
      XAMARIN_MAC_URL: "https://download.visualstudio.microsoft.com/download/pr/ceb0ea3f-4db8-46b4-8dc3-8049d27c0107/7b04843d469aae253519989fcb8e750f/xamarin.mac-9.3.0.23.pkg"

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # ============================================================
      # RUNNER
      # ============================================================

      - name: Show runner information
        shell: bash
        run: |
          set -euxo pipefail

          echo "RUNNER_ARCH=$RUNNER_ARCH"
          echo "RUNNER_OS=$RUNNER_OS"

          echo
          echo "CPU:"
          uname -m

          echo
          echo "System:"
          uname -a

          echo
          echo "macOS:"
          sw_vers

          echo
          echo "Xcode:"
          xcode-select -p
          xcodebuild -version

      # ============================================================
      # ROSETTA
      # ============================================================

      - name: Install Rosetta 2
        shell: bash
        run: |
          set -euxo pipefail

          if [ "$(uname -m)" = "arm64" ]; then
            sudo softwareupdate \
              --install-rosetta \
              --agree-to-license
          fi

          echo "Native architecture:"
          arch -arm64 uname -m

          echo
          echo "Rosetta architecture:"
          arch -x86_64 uname -m

      # ============================================================
      # MONO
      # ============================================================

      - name: Install Mono
        shell: bash
        run: |
          set -euxo pipefail

          brew update

          brew install mono || true

      - name: Configure Mono PATH
        shell: bash
        run: |
          set -euxo pipefail

          if [ -d "/Library/Frameworks/Mono.framework/Versions/Current/bin" ]; then
            echo "/Library/Frameworks/Mono.framework/Versions/Current/bin" >> "$GITHUB_PATH"
          fi

          if [ -d "/Library/Frameworks/Mono.framework/Commands" ]; then
            echo "/Library/Frameworks/Mono.framework/Commands" >> "$GITHUB_PATH"
          fi

      # ============================================================
      # VERIFY MONO
      # ============================================================

      - name: Verify Mono and MSBuild
        shell: bash
        run: |
          set -euxo pipefail

          echo "Mono:"
          command -v mono
          mono --version

          echo
          echo "MSBuild:"
          command -v msbuild
          msbuild -version

      # ============================================================
      # DOWNLOAD XAMARIN.MAC
      # ============================================================

      - name: Download Xamarin.Mac 9.3.0.23
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$RUNNER_TEMP/xamarin"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 30 \
            "$XAMARIN_MAC_URL" \
            --output "$RUNNER_TEMP/xamarin/$XAMARIN_MAC_PKG"

          echo
          echo "Downloaded package:"
          ls -lh "$RUNNER_TEMP/xamarin/$XAMARIN_MAC_PKG"

          echo
          echo "File:"
          file "$RUNNER_TEMP/xamarin/$XAMARIN_MAC_PKG"

      # ============================================================
      # VERIFY PACKAGE SIGNATURE
      # ============================================================

      - name: Verify Xamarin.Mac package
        shell: bash
        run: |
          set -euxo pipefail

          PKG="$RUNNER_TEMP/xamarin/$XAMARIN_MAC_PKG"

          echo "Package signature:"
          pkgutil --check-signature "$PKG"

      # ============================================================
      # INSTALL XAMARIN.MAC
      # ============================================================

      - name: Install Xamarin.Mac 9.3.0.23
        shell: bash
        run: |
          set -euxo pipefail

          PKG="$RUNNER_TEMP/xamarin/$XAMARIN_MAC_PKG"

          sudo installer \
            -pkg "$PKG" \
            -target /

      # ============================================================
      # DISCOVER XAMARIN.MAC INSTALLATION
      # ============================================================

      - name: Locate Xamarin.Mac
        shell: bash
        run: |
          set -euxo pipefail

          echo "================================================"
          echo "Xamarin.Mac.framework"
          echo "================================================"

          if [ -d "/Library/Frameworks/Xamarin.Mac.framework" ]; then
            find /Library/Frameworks/Xamarin.Mac.framework \
              -maxdepth 7 \
              -print
          else
            echo "Xamarin.Mac.framework not found."
          fi

          echo
          echo "================================================"
          echo "Xamarin.Mac.CSharp.targets"
          echo "================================================"

          find /Library/Frameworks \
            -name "Xamarin.Mac.CSharp.targets" \
            -print 2>/dev/null || true

          echo
          echo "================================================"
          echo "Xamarin.Mac.dll"
          echo "================================================"

          find /Library/Frameworks \
            -name "Xamarin.Mac.dll" \
            -print 2>/dev/null || true

          echo
          echo "================================================"
          echo "mmp"
          echo "================================================"

          find /Library/Frameworks \
            -name "mmp" \
            -type f \
            -print 2>/dev/null || true

          echo
          echo "================================================"
          echo "Xamarin directories"
          echo "================================================"

          find /Library/Frameworks \
            -type d \
            -iname "*Xamarin*" \
            -print 2>/dev/null || true

      # ============================================================
      # FIND TARGET FILE
      # ============================================================

      - name: Find Xamarin.Mac MSBuild targets
        shell: bash
        run: |
          set -euxo pipefail

          TARGET="$(find /Library/Frameworks \
            -name "Xamarin.Mac.CSharp.targets" \
            -print \
            -quit 2>/dev/null || true)"

          if [ -z "$TARGET" ]; then
            echo
            echo "ERROR: Xamarin.Mac.CSharp.targets was not installed."
            echo
            echo "Full Xamarin.Mac search:"
            find /Library/Frameworks \
              -iname "*xamarin*" \
              -print 2>/dev/null || true
            exit 1
          fi

          echo "TARGET=$TARGET"

          echo "XAMARIN_MAC_TARGET=$TARGET" >> "$GITHUB_ENV"

      # ============================================================
      # BRIDGE TARGETS TO MONO
      #
      # The BizHawk project imports:
      #
      # $(MSBuildExtensionsPath)\Xamarin\Mac\
      #
      # Mono's MSBuild fallback includes:
      #
      # /Library/Frameworks/Mono.framework/External/xbuild/
      #
      # ============================================================

      - name: Configure Xamarin.Mac for Mono MSBuild
        shell: bash
        run: |
          set -euxo pipefail

          TARGET="$XAMARIN_MAC_TARGET"

          TARGET_DIR="$(dirname "$TARGET")"

          echo "Source:"
          echo "$TARGET_DIR"

          MONO_XBUILD="/Library/Frameworks/Mono.framework/External/xbuild/Xamarin/Mac"

          echo
          echo "Destination:"
          echo "$MONO_XBUILD"

          sudo mkdir -p "$MONO_XBUILD"

          sudo cp -R \
            "$TARGET_DIR"/. \
            "$MONO_XBUILD"/

          echo
          echo "Installed files:"
          find "$MONO_XBUILD" \
            -maxdepth 3 \
            -type f \
            -print

      # ============================================================
      # VERIFY EXACT IMPORT PATH
      # ============================================================

      - name: Verify Xamarin.Mac MSBuild integration
        shell: bash
        run: |
          set -euxo pipefail

          TARGET="/Library/Frameworks/Mono.framework/External/xbuild/Xamarin/Mac/Xamarin.Mac.CSharp.targets"

          if [ ! -f "$TARGET" ]; then
            echo "ERROR: target was not installed:"
            echo "$TARGET"
            exit 1
          fi

          echo "Target exists:"
          ls -lh "$TARGET"

          echo
          echo "Target directory:"
          ls -la "$(dirname "$TARGET")"

      # ============================================================
      # VERIFY XAMARIN.MAC ASSEMBLIES
      # ============================================================

      - name: Verify Xamarin.Mac assemblies
        shell: bash
        run: |
          set -euxo pipefail

          echo "Xamarin.Mac.dll files:"

          find /Library/Frameworks \
            -name "Xamarin.Mac.dll" \
            -print 2>/dev/null || true

          echo
          echo "Mono Xamarin assemblies:"

          find /Library/Frameworks/Mono.framework \
            -path "*Xamarin*" \
            -type f \
            -print 2>/dev/null | head -300

      # ============================================================
      # VERIFY NATIVE XAMARIN TOOLS
      # ============================================================

      - name: Verify Xamarin.Mac tools
        shell: bash
        run: |
          set -euxo pipefail

          echo "mmp:"
          find /Library/Frameworks/Xamarin.Mac.framework \
            -name "mmp" \
            -type f \
            -print 2>/dev/null || true

          echo
          echo "Other Xamarin.Mac tools:"
          find /Library/Frameworks/Xamarin.Mac.framework \
            -type f \
            -perm -111 \
            -print 2>/dev/null | head -200 || true

      # ============================================================
      # SUBMODULES
      # ============================================================

      - name: Initialize submodules
        shell: bash
        run: |
          set -euxo pipefail

          git submodule sync --recursive
          git submodule update --init --recursive

      # ============================================================
      # BUILD NORMAL BIZHAWK MONO OUTPUT
      # ============================================================

      - name: Build BizHawk Mono Release
        shell: bash
        run: |
          set -euxo pipefail

          chmod +x Dist/*.sh

          ./Dist/MonoBuildRelease.sh

      # ============================================================
      # VERIFY NORMAL OUTPUT
      # ============================================================

      - name: Verify BizHawk output
        shell: bash
        run: |
          set -euxo pipefail

          test -d output

          echo "BizHawk output:"
          find output \
            -maxdepth 2 \
            -type f \
            -print | head -300

      # ============================================================
      # PATCH MAC PROJECT TO ARM64
      # ============================================================

      - name: Configure Mac project for ARM64
        shell: bash
        run: |
          set -euxo pipefail

          PROJECT="BizHawk.Client.EmuHawkMacApp/BizHawk.Client.EmuHawkMacApp.csproj"

          cp "$PROJECT" "$PROJECT.original"

          echo "Original PlatformTarget:"
          grep -n "PlatformTarget" "$PROJECT" || true

          sed -i '' \
            's/<PlatformTarget>x64<\/PlatformTarget>/<PlatformTarget>ARM64<\/PlatformTarget>/g' \
            "$PROJECT"

          echo
          echo "Updated PlatformTarget:"
          grep -n "PlatformTarget" "$PROJECT" || true

          if grep -q '<PlatformTarget>x64</PlatformTarget>' "$PROJECT"; then
            echo "ERROR: x64 PlatformTarget remains."
            exit 1
          fi

      # ============================================================
      # VERIFY MAC PROJECT
      # ============================================================

      - name: Inspect Mac project
        shell: bash
        run: |
          set -euxo pipefail

          PROJECT="BizHawk.Client.EmuHawkMacApp/BizHawk.Client.EmuHawkMacApp.csproj"

          echo "Xamarin.Mac references:"
          grep -n "Xamarin.Mac" "$PROJECT" || true

          echo
          echo "Target framework:"
          grep -n \
            "TargetFramework\|TargetFrameworkVersion" \
            "$PROJECT" || true

          echo
          echo "PlatformTarget:"
          grep -n "PlatformTarget" "$PROJECT" || true

          echo
          echo "Xamarin import:"
          grep -n \
            "Xamarin.Mac.CSharp.targets" \
            "$PROJECT" || true

      # ============================================================
      # BUILD MACOS APP
      # ============================================================

      - name: Build macOS ARM64 application
        shell: bash
        run: |
          set -euxo pipefail

          PROJECT="BizHawk.Client.EmuHawkMacApp/BizHawk.Client.EmuHawkMacApp.csproj"

          msbuild "$PROJECT" \
            /t:Rebuild \
            /p:Configuration=Release \
            /p:Platform=AnyCPU \
            /p:PlatformTarget=ARM64 \
            /p:CreatePackage=true \
            /p:IncludeMonoRuntime=true \
            /p:DebugSymbols=false \
            /p:DebugType=None \
            /verbosity:normal

      # ============================================================
      # LOCATE APP
      # ============================================================

      - name: Locate application bundle
        shell: bash
        run: |
          set -euxo pipefail

          echo "Generated .app bundles:"

          find BizHawk.Client.EmuHawkMacApp \
            -type d \
            -name "*.app" \
            -print

      # ============================================================
      # VERIFY APP
      # ============================================================

      - name: Verify application bundle
        shell: bash
        run: |
          set -euxo pipefail

          APP="$(find BizHawk.Client.EmuHawkMacApp \
            -type d \
            -name "*.app" \
            -print \
            -quit)"

          if [ -z "$APP" ]; then
            echo "ERROR: no .app was generated."
            exit 1
          fi

          echo "APP=$APP"

          echo "APP=$APP" >> "$GITHUB_ENV"

          test -d "$APP/Contents"
          test -f "$APP/Contents/Info.plist"

          echo
          echo "Bundle:"
          find "$APP/Contents" \
            -maxdepth 3 \
            -type f \
            -print | head -300

      # ============================================================
      # FIND EXECUTABLE
      # ============================================================

      - name: Inspect application executables
        shell: bash
        run: |
          set -euxo pipefail

          echo "Contents/MacOS:"

          find "$APP/Contents/MacOS" \
            -maxdepth 1 \
            -type f \
            -print \
            -exec file {} \;

      # ============================================================
      # VERIFY MAIN EXECUTABLE
      # ============================================================

      - name: Verify ARM64 executable
        shell: bash
        run: |
          set -euxo pipefail

          EXEC="$APP/Contents/MacOS/BizHawk"

          if [ ! -f "$EXEC" ]; then
            echo "ERROR: BizHawk executable was not found:"
            echo "$EXEC"

            echo
            echo "Available files:"
            find "$APP/Contents/MacOS" \
              -maxdepth 1 \
              -type f \
              -print

            exit 1
          fi

          echo "Executable:"
          file "$EXEC"

          echo
          echo "lipo:"
          lipo -info "$EXEC"

          echo
          echo "Architecture check:"

          INFO="$(file "$EXEC")"

          if ! echo "$INFO" | grep -q "arm64"; then
            echo "ERROR: BizHawk executable is not ARM64."
            echo "$INFO"
            exit 1
          fi

          echo "ARM64 confirmed."

      # ============================================================
      # CHECK ALL MACH-O FILES
      # ============================================================

      - name: Verify native binaries
        shell: bash
        run: |
          set -uo pipefail

          FAILED=0

          while IFS= read -r -d '' FILE; do
            INFO="$(file "$FILE")"

            if echo "$INFO" | grep -q "Mach-O"; then
              echo
              echo "$FILE"
              echo "$INFO"

              if ! echo "$INFO" | grep -q "arm64"; then
                echo
                echo "WARNING: non-ARM64 Mach-O:"
                echo "$FILE"
                FAILED=1
              fi
            fi
          done < <(find "$APP" -type f -print0)

          if [ "$FAILED" -ne 0 ]; then
            echo
            echo "ERROR: one or more Mach-O files are not ARM64."
            exit 1
          fi

      # ============================================================
      # INFO.PLIST
      # ============================================================

      - name: Validate Info.plist
        shell: bash
        run: |
          set -euxo pipefail

          plutil \
            -lint \
            "$APP/Contents/Info.plist"

          echo
          echo "Info.plist:"
          plutil \
            -p \
            "$APP/Contents/Info.plist"

      # ============================================================
      # PACKAGE
      # ============================================================

      - name: Package ARM64 application
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p artifact

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "$APP" \
            "artifact/BizHawk-macOS-ARM64.zip"

          echo
          echo "Package:"
          ls -lh \
            "artifact/BizHawk-macOS-ARM64.zip"

      # ============================================================
      # UPLOAD ZIP
      # ============================================================

      - name: Upload ARM64 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: BizHawk-macOS-ARM64
          path: artifact/BizHawk-macOS-ARM64.zip
          if-no-files-found: error
          retention-days: 14

      # ============================================================
      # UPLOAD RAW APP
      # ============================================================

      - name: Upload raw ARM64 app
        uses: actions/upload-artifact@v4
        with:
          name: BizHawk-macOS-ARM64-app
          path: BizHawk.Client.EmuHawkMacApp/bin/Release/*.app
          if-no-files-found: warn
