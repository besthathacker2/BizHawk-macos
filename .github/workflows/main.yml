name: BizHawk macOS ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - MacUnixMonoCompat

permissions:
  contents: read

jobs:
  build:
    name: Build BizHawk macOS ARM64
    runs-on: macos-14

    env:
      XAMARIN_MAC_VERSION: "9.3.0.23"
      XAMARIN_MAC_PKG: "xamarin.mac-9.3.0.23.pkg"
      XAMARIN_MAC_URL: "https://download.visualstudio.microsoft.com/download/pr/ceb0ea3f-4db8-46b4-8dc3-8049d27c0107/7b04843d469aae253519989fcb8e750f/xamarin.mac-9.3.0.23.pkg"

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # ============================================================
      # MACHINE INFORMATION
      # ============================================================

      - name: Show runner information
        shell: bash
        run: |
          set -euxo pipefail

          echo "RUNNER_ARCH=$RUNNER_ARCH"
          echo "RUNNER_OS=$RUNNER_OS"

          echo
          echo "uname:"
          uname -a
          uname -m

          echo
          echo "macOS:"
          sw_vers

          echo
          echo "Xcode:"
          xcodebuild -version

      # ============================================================
      # ROSETTA
      # ============================================================

      - name: Install Rosetta 2
        shell: bash
        run: |
          set -euxo pipefail

          if [ "$(uname -m)" = "arm64" ]; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi

          echo "Native:"
          arch -arm64 uname -m

          echo "Rosetta:"
          arch -x86_64 uname -m

      # ============================================================
      # MONO
      # ============================================================

      - name: Install Mono
        shell: bash
        run: |
          set -euxo pipefail

          brew update
          brew install mono || true

      - name: Configure Mono PATH
        shell: bash
        run: |
          set -euxo pipefail

          if [ -d "/Library/Frameworks/Mono.framework/Versions/Current/bin" ]; then
            echo "/Library/Frameworks/Mono.framework/Versions/Current/bin" >> "$GITHUB_PATH"
          fi

          if [ -d "/Library/Frameworks/Mono.framework/Commands" ]; then
            echo "/Library/Frameworks/Mono.framework/Commands" >> "$GITHUB_PATH"
          fi

      # ============================================================
      # VERIFY MONO
      # ============================================================

      - name: Verify Mono and MSBuild
        shell: bash
        run: |
          set -euxo pipefail

          echo "Mono:"
          which mono
          mono --version

          echo
          echo "MSBuild:"
          which msbuild
          msbuild -version

      # ============================================================
      # DOWNLOAD XAMARIN.MAC
      # ============================================================

      - name: Download Xamarin.Mac 9.3.0.23
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$RUNNER_TEMP/xamarin"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 30 \
            "$XAMARIN_MAC_URL" \
            --output "$RUNNER_TEMP/xamarin/$XAMARIN_MAC_PKG"

          ls -lh "$RUNNER_TEMP/xamarin/$XAMARIN_MAC_PKG"

          file "$RUNNER_TEMP/xamarin/$XAMARIN_MAC_PKG"

      # ============================================================
      # VERIFY PACKAGE
      # ============================================================

      - name: Verify Xamarin.Mac package
        shell: bash
        run: |
          set -euxo pipefail

          PKG="$RUNNER_TEMP/xamarin/$XAMARIN_MAC_PKG"

          echo "Package:"
          pkgutil --pkg-info-plist "$PKG" || true

          echo
          echo "Signature:"
          pkgutil --check-signature "$PKG"

      # ============================================================
      # INSTALL XAMARIN.MAC
      #
      # This is the important part.
      #
      # Do NOT copy individual targets manually.
      # ============================================================

      - name: Install Xamarin.Mac 9.3.0.23
        shell: bash
        run: |
          set -euxo pipefail

          PKG="$RUNNER_TEMP/xamarin/$XAMARIN_MAC_PKG"

          sudo installer \
            -pkg "$PKG" \
            -target /

      # ============================================================
      # FIND XAMARIN.MAC
      # ============================================================

      - name: Verify Xamarin.Mac installation
        shell: bash
        run: |
          set -euxo pipefail

          echo "Xamarin.Mac targets:"
          find /Library/Frameworks/Mono.framework \
            -name "Xamarin.Mac.CSharp.targets" \
            -print 2>/dev/null || true

          echo
          echo "Xamarin.Mac assemblies:"
          find /Library/Frameworks/Mono.framework \
            -name "Xamarin.Mac.dll" \
            -print 2>/dev/null || true

          echo
          echo "Xamarin.Mac directories:"
          find /Library/Frameworks/Mono.framework \
            -type d \
            -path "*Xamarin/Mac*" \
            -print 2>/dev/null || true

      # ============================================================
      # CHECK EXACT FILE FROM YOUR ERROR
      # ============================================================

      - name: Verify MSBuild Xamarin.Mac target
        shell: bash
        run: |
          set -euxo pipefail

          TARGET="/Library/Frameworks/Mono.framework/Versions/6.12.0/lib/mono/xbuild/Xamarin/Mac/Xamarin.Mac.CSharp.targets"

          if [ ! -f "$TARGET" ]; then
            echo
            echo "ERROR:"
            echo "$TARGET"
            echo "does not exist."
            echo
            echo "Searching for the actual target:"
            find /Library/Frameworks/Mono.framework \
              -name "Xamarin.Mac.CSharp.targets" \
              -print 2>/dev/null || true

            exit 1
          fi

          ls -l "$TARGET"

      # ============================================================
      # SHOW XAMARIN.MAC VERSION
      # ============================================================

      - name: Show Xamarin.Mac version
        shell: bash
        run: |
          set -euxo pipefail

          find /Library/Frameworks/Mono.framework \
            -name "Xamarin.Mac.dll" \
            -print \
            -exec sh -c '
              echo "Assembly: $1"
              /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$1" 2>/dev/null || true
            ' _ {} \;

      # ============================================================
      # SUBMODULES
      # ============================================================

      - name: Initialize submodules
        shell: bash
        run: |
          set -euxo pipefail

          git submodule sync --recursive
          git submodule update --init --recursive

      # ============================================================
      # BUILD NORMAL BIZHAWK
      # ============================================================

      - name: Build BizHawk Mono Release
        shell: bash
        run: |
          set -euxo pipefail

          chmod +x Dist/*.sh

          ./Dist/MonoBuildRelease.sh

      # ============================================================
      # VERIFY NORMAL OUTPUT
      # ============================================================

      - name: Verify BizHawk output
        shell: bash
        run: |
          set -euxo pipefail

          test -d output

          echo "BizHawk output:"
          find output -maxdepth 2 -type f | head -300

      # ============================================================
      # PATCH MAC PROJECT
      #
      # Original project contains:
      #
      #   <PlatformTarget>x64</PlatformTarget>
      #
      # Change it to ARM64 for CI.
      # ============================================================

      - name: Configure Mac project for ARM64
        shell: bash
        run: |
          set -euxo pipefail

          PROJECT="BizHawk.Client.EmuHawkMacApp/BizHawk.Client.EmuHawkMacApp.csproj"

          cp "$PROJECT" "$PROJECT.original"

          echo "Original PlatformTarget:"
          grep -n "PlatformTarget" "$PROJECT" || true

          sed -i '' \
            's/<PlatformTarget>x64<\/PlatformTarget>/<PlatformTarget>ARM64<\/PlatformTarget>/g' \
            "$PROJECT"

          echo
          echo "New PlatformTarget:"
          grep -n "PlatformTarget" "$PROJECT" || true

          if grep -q '<PlatformTarget>x64</PlatformTarget>' "$PROJECT"; then
            echo "ERROR: x64 PlatformTarget remains."
            exit 1
          fi

      # ============================================================
      # SHOW MAC PROJECT
      # ============================================================

      - name: Verify Mac project
        shell: bash
        run: |
          set -euxo pipefail

          PROJECT="BizHawk.Client.EmuHawkMacApp/BizHawk.Client.EmuHawkMacApp.csproj"

          echo "Xamarin imports:"
          grep -n "Xamarin.Mac" "$PROJECT" || true

          echo
          echo "Target framework:"
          grep -n "TargetFramework\|TargetFrameworkVersion" "$PROJECT" || true

          echo
          echo "Platform:"
          grep -n "PlatformTarget" "$PROJECT" || true

      # ============================================================
      # BUILD MAC APP
      # ============================================================

      - name: Build macOS ARM64 application
        shell: bash
        run: |
          set -euxo pipefail

          PROJECT="BizHawk.Client.EmuHawkMacApp/BizHawk.Client.EmuHawkMacApp.csproj"

          msbuild "$PROJECT" \
            /t:Rebuild \
            /p:Configuration=Release \
            /p:Platform=AnyCPU \
            /p:PlatformTarget=ARM64 \
            /p:CreatePackage=true \
            /p:IncludeMonoRuntime=true \
            /p:DebugSymbols=false \
            /p:DebugType=None \
            /verbosity:minimal

      # ============================================================
      # LOCATE APP
      # ============================================================

      - name: Locate .app
        shell: bash
        run: |
          set -euxo pipefail

          echo "Applications:"
          find BizHawk.Client.EmuHawkMacApp \
            -type d \
            -name "*.app" \
            -print

      # ============================================================
      # VERIFY APP EXISTS
      # ============================================================

      - name: Verify application bundle
        shell: bash
        run: |
          set -euxo pipefail

          APP=$(find BizHawk.Client.EmuHawkMacApp \
            -type d \
            -name "*.app" \
            -print -quit)

          if [ -z "$APP" ]; then
            echo "ERROR: no .app was generated."
            exit 1
          fi

          echo "APP=$APP"

          test -d "$APP/Contents"
          test -f "$APP/Contents/Info.plist"

          echo
          echo "Bundle contents:"
          find "$APP/Contents" \
            -maxdepth 3 \
            -type f | head -300

      # ============================================================
      # FIND MAIN EXECUTABLE
      # ============================================================

      - name: Find native executable
        shell: bash
        run: |
          set -euxo pipefail

          APP=$(find BizHawk.Client.EmuHawkMacApp \
            -type d \
            -name "*.app" \
            -print -quit)

          echo "MacOS directory:"
          find "$APP/Contents/MacOS" \
            -maxdepth 1 \
            -type f \
            -print \
            -exec file {} \;

      # ============================================================
      # VERIFY ARM64
      # ============================================================

      - name: Verify ARM64 executable
        shell: bash
        run: |
          set -euxo pipefail

          APP=$(find BizHawk.Client.EmuHawkMacApp \
            -type d \
            -name "*.app" \
            -print -quit)

          EXEC="$APP/Contents/MacOS/BizHawk"

          if [ ! -f "$EXEC" ]; then
            echo "ERROR: BizHawk executable not found:"
            echo "$EXEC"

            echo
            echo "Available files:"
            find "$APP/Contents/MacOS" \
              -maxdepth 1 \
              -type f \
              -print

            exit 1
          fi

          echo "Executable:"
          file "$EXEC"

          echo
          echo "lipo:"
          lipo -info "$EXEC"

          echo
          echo "Architecture:"
          ARCH_INFO="$(file "$EXEC")"
          echo "$ARCH_INFO"

          if ! echo "$ARCH_INFO" | grep -q "arm64"; then
            echo
            echo "ERROR: executable is not ARM64."
            exit 1
          fi

      # ============================================================
      # CHECK ALL NATIVE MACH-O FILES
      # ============================================================

      - name: Check native binaries
        shell: bash
        run: |
          set -uo pipefail

          APP=$(find BizHawk.Client.EmuHawkMacApp \
            -type d \
            -name "*.app" \
            -print -quit)

          FAILED=0

          while IFS= read -r -d '' FILE; do
            INFO="$(file "$FILE")"

            if echo "$INFO" | grep -q "Mach-O"; then
              echo
              echo "$FILE"
              echo "$INFO"

              if ! echo "$INFO" | grep -q "arm64"; then
                echo "WARNING: non-ARM64 native binary"
                FAILED=1
              fi
            fi
          done < <(find "$APP" -type f -print0)

          if [ "$FAILED" -ne 0 ]; then
            echo
            echo "ERROR: one or more Mach-O files are not ARM64."
            exit 1
          fi

      # ============================================================
      # INFO.PLIST
      # ============================================================

      - name: Validate Info.plist
        shell: bash
        run: |
          set -euxo pipefail

          APP=$(find BizHawk.Client.EmuHawkMacApp \
            -type d \
            -name "*.app" \
            -print -quit)

          plutil -lint "$APP/Contents/Info.plist"

          echo
          plutil -p "$APP/Contents/Info.plist"

      # ============================================================
      # PACKAGE
      # ============================================================

      - name: Package ARM64 app
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p artifact

          APP=$(find BizHawk.Client.EmuHawkMacApp \
            -type d \
            -name "*.app" \
            -print -quit)

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "$APP" \
            "artifact/BizHawk-macOS-ARM64.zip"

          echo
          echo "Artifact:"
          ls -lh artifact/

      # ============================================================
      # UPLOAD ZIP
      # ============================================================

      - name: Upload ARM64 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: BizHawk-macOS-ARM64
          path: artifact/BizHawk-macOS-ARM64.zip
          if-no-files-found: error
          retention-days: 14

      # ============================================================
      # UPLOAD RAW APP
      # ============================================================

      - name: Upload raw ARM64 app
        uses: actions/upload-artifact@v4
        with:
          name: BizHawk-macOS-ARM64-app
          path: BizHawk.Client.EmuHawkMacApp/bin/Release/*.app
          if-no-files-found: warn
          retention-days: 14
